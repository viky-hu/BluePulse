[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepulse-backend"
version = "0.2.0"
description = "Blue Pulse backend foundation and offline pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bluepulse_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
