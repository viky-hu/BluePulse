[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepulse-backend"
version = "0.1.0"
description = "Blue Pulse Stage 1 backend foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.28,<1.0",
  "feedparser>=6.0,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bluepulse_backend*"]
